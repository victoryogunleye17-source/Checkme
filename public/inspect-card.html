<!--
  Paste this new <section class="card"> block into public/index.html,
  right after the "Find breaking point (capacity ramp)" section
  and before the closing </main> / footer-note paragraph.
-->

<!-- Inspect page -->
<section class="card">
  <h2>Inspect page</h2>
  <p class="hint">Fetches the page once and reports what's actually on it — title, headings, links, forms, and contact info. No load generated, just a single real request.</p>
  <button class="btn btn-primary" id="inspectBtn" onclick="startInspect()">▸ Inspect page</button>

  <div id="inspectPanel" style="display:none;">
    <div class="mono small" id="inspectStatus">Fetching page…</div>
  </div>

  <div id="inspectResultPanel" style="display:none;">
    <h3>Page details (real)</h3>
    <table id="inspectTable"></table>

    <div id="inspectFormsBlock" style="margin-top:14px;"></div>
    <div id="inspectLinksBlock" style="margin-top:14px;"></div>
    <div id="inspectContactBlock" style="margin-top:14px;"></div>
  </div>
</section>
